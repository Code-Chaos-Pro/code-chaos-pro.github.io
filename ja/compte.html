<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイアカウント</title>
<meta name="description" content="Code &amp; Chaos のアカウント。">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://codechaoslab.com/ja/compte">
<link rel="icon" type="image/png" sizes="192x192" href="/images/code-chaos.png">
<link rel="stylesheet" href="/style.css?19">
<script src="logiciels.js?14"></script>
<script src="compte.js?6"></script>
<script src="direct.js?1"></script>
<script src="avis.js?3"></script>
</head>
<body>
<header class="cadre entete">
  <a class="marque" href="./">Code <span>&amp;</span> Chaos</a>
  <nav aria-label="ページ"><a href="./">ソフト</a><a href="contact">チケットを作成</a><a href="tickets" id="mes-tickets" hidden>マイチケット</a><a href="apropos">このサイトについて</a></nav>
  <script>outils()</script>
</header>
<main class="cadre">
<section class="intro">
  <h1>マイアカウント</h1>
  <p id="etat" role="status">読み込み中…</p>
</section>
<div class="connexion" id="connexion"></div>
<div class="tickets" id="mon-compte" hidden>
<section class="encart"><h2>プロフィール</h2>
  <p class="doux">ユーザー名とアバターはレビューの横に表示されます。</p>
  <form id="f-pseudo"><label class="champ" for="pseudo">ユーザー名 <input id="pseudo"></label><p class="doux" id="e-pseudo" role="status"></p><div><button class="bouton">保存</button></div></form>
  <h3>アバター</h3><div class="avatars" id="avatars" role="group" aria-label="アバター"></div>
  <dl class="fiche" id="fiche"></dl>
</section>
<section class="encart"><h2>お気に入り</h2><div id="favoris"></div></section>
<section class="encart"><h2>履歴</h2><div id="historique"></div><div><button class="fermer" type="button" id="vider">履歴を消去</button></div></section>
<section class="encart"><h2>自分のレビュー</h2><div class="colonne" id="mes-avis"></div></section>
<section class="encart"><h2>サインアウト</h2><div><button class="fermer" type="button" id="sortir">サインアウト</button></div></section>
<section class="encart"><h2>アカウントを削除</h2><p>この操作は取り消せません。すべてのデータが削除されます。</p><div><button class="bouton danger" type="button" id="supprimer">アカウントを削除</button></div></section>
</div>
</main>
<footer><div class="cadre">
  <p class="doux">Code &amp; Chaos。無料ソフト。 <a href="/mentions-legales">法的事項（フランス語）</a> · <a href="/confidentialite">プライバシー（フランス語）</a></p>
  <a class="don" href="https://ko-fi.com/codechaos"><svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M14,4 H15.5 A3,3 0 0 1 15.5,10 H14" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1,2 H14 V10 A4,4 0 0 1 10,14 H5 A4,4 0 0 1 1,10 Z" fill="#fff"/><path d="M7.5,11.5 L4.2,8 A2,2 0 0 1 7.5,5.6 A2,2 0 0 1 10.8,8 Z" fill="#ff5e5b"/></svg>寄付する</a>
</div></footer>
<script>
const $ = id => document.getElementById(id);
const texte = t => { const p = document.createElement('p'); p.className = 'doux'; p.textContent = t; return p; };
Object.assign($('pseudo'), PSEUDO);
$('avatars').append(...AVATARS.map((_, n) => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('aria-label', `${"アバター"} ${n + 1}`); b.append(avatar(n));
  b.onclick = () => modifierProfil({ avatar: n }).catch(() => { $('e-pseudo').textContent = "アバターを保存できませんでした。もう一度お試しください。"; });
  return b;
}));
$('f-pseudo').onsubmit = async e => {
  e.preventDefault();
  try { await modifierProfil({ pseudo: $('pseudo').value.trim() }); $('e-pseudo').textContent = "ユーザー名を保存しました。"; }
  catch (x) { $('e-pseudo').textContent = erreurPseudo(x); }
};
function montrerFavoris() { $('favoris').replaceChildren(favoris.size ? listeLogiciels([...favoris].map(f => [f])) : texte("お気に入りはまだありません。ソフトの星をクリックしてください。")); }
async function montrerHistorique() {
  let vus = [];
  try { vus = await lireTable('historique?select=logiciel,vu&order=vu.desc'); } catch { return $('historique').replaceChildren(texte("履歴を読み込めません。")); }
  $('vider').hidden = !vus.length;
  $('historique').replaceChildren(vus.length ? listeLogiciels(vus.map(v => [v.logiciel, dateFr(v.vu)])) : texte("履歴はありません。"));
}
$('vider').onclick = () => appel('/rest/v1/historique?compte=eq.' + session.id, undefined, {}, 'DELETE').then(montrerHistorique, () => $('historique').append(texte("履歴を消去できませんでした。もう一度お試しください。")));
$('sortir').onclick = deconnecter;
$('supprimer').onclick = () => {
  const { d, zone, pied } = fenetre("アカウントを削除しますか？", "キャンセル"), p = texte("この操作は取り消せません。すべてのデータが削除されます。");
  const b = bouton("削除", async () => {
    b.disabled = true; p.textContent = "削除中…";
    try {
      // Images des tickets d'abord : la base ne sait pas effacer les fichiers.
      const dossier = session.id;
      const images = await (await appel('/storage/v1/object/list/messages', { prefix: dossier, limit: 1000 })).json();
      if (images.length) await appel('/storage/v1/object/messages', { prefixes: images.map(i => `${dossier}/${i.name}`) }, {}, 'DELETE');
      await appel('/rest/v1/rpc/supprimer_compte', {});
      d.close(); changer(null);
    } catch { b.disabled = false; ecrire(p, "アカウントを削除できませんでした。もう一度お試しください。", true); }
  }, 'bouton danger');
  zone.append(p); pied.append(b);
};
async function montrerAvis(debut = 0) {
  try {
    const lus = await rpc('lire_avis', { les_miens: true, debut });
    const cartes = lus.slice(0, PAGE).map(a => carteAvis(a, () => montrerAvis(), true));
    if (lus.length > PAGE) { const suite = bouton("もっと見る", () => { suite.remove(); montrerAvis(debut + PAGE); }, 'fermer'); cartes.push(suite); }
    if (!lus.length && !debut) cartes.push(texte("まだレビューを書いていません。"));
    debut ? $('mes-avis').append(...cartes) : $('mes-avis').replaceChildren(...cartes);
  } catch { $('mes-avis').replaceChildren(texte("レビューを読み込めません。")); }
}
let montre = null; // compte dont l'historique et les avis sont déjà affichés
async function montrer() {
  $('mon-compte').hidden = !session?.pseudo;
  $('connexion').replaceChildren();
  if (!session?.pseudo) { montre = null; return montrerCompte($('etat'), $('connexion'), "アカウントを見るにはログインしてください。"); }
  ecrire($('etat'), '');
  $('pseudo').value = session.pseudo;
  [...$('avatars').children].forEach((b, n) => b.setAttribute('aria-pressed', n === session.avatar));
  $('fiche').replaceChildren(...[["メールアドレス", session.email || "なし"], ["アカウント作成日", dateFr(session.cree)]].flatMap(([t, v]) => { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = t; dd.textContent = v; return [dt, dd]; }));
  montrerFavoris();
  if (montre !== session.id) { montre = session.id; montrerHistorique(); montrerAvis(); }
}
document.addEventListener('compte', montrer);
document.addEventListener('favoris', montrerFavoris);
const relireAvis = regrouper(() => { $('mes-avis').querySelector('form') ? relireAvis() : montrerAvis(); }, 1500);
document.addEventListener('direct', e => { if (e.detail.sujet.startsWith('compte:') && ['avis', 'tout'].includes(e.detail.quoi)) relireAvis(); });
compte.then(montrer);
</script>
</body>
</html>
