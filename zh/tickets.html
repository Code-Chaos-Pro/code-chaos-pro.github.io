<body>
<header class="cadre entete">
  <a class="marque" href="./">Code <span>&amp;</span> Chaos</a>
  <nav aria-label="页面"><a href="./">软件</a><a href="contact">提交工单</a><a href="tickets" id="mes-tickets" aria-current="page">我的工单</a><a href="apropos">关于</a></nav>
  <script>outils()</script>
</header>
<main class="cadre">
<section class="intro">
  <h1>我的工单</h1>
  <p id="etat" role="status">正在加载…</p>
</section>
<div class="connexion" id="connexion"></div>
<div class="tickets" id="tickets"></div>
</main>
<footer><div class="cadre">
  <p class="doux">Code &amp; Chaos。免费软件。 <a href="/mentions-legales">法律声明（法语）</a> · <a href="/confidentialite">隐私（法语）</a></p>
  <a class="don" href="https://ko-fi.com/codechaos"><svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M14,4 H15.5 A3,3 0 0 1 15.5,10 H14" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1,2 H14 V10 A4,4 0 0 1 10,14 H5 A4,4 0 0 1 1,10 Z" fill="#fff"/><path d="M7.5,11.5 L4.2,8 A2,2 0 0 1 7.5,5.6 A2,2 0 0 1 10.8,8 Z" fill="#ff5e5b"/></svg>捐赠</a>
</div></footer>
<script>
const $ = id => document.getElementById(id);
const cartes = new Map(); // numéro → carte : seules les nouveautés changent à l'écran
let compteVu = null, plus = null;
async function montrer() {
  if (!session || compteVu !== session.id) { cartes.clear(); $('tickets').replaceChildren(); }
  compteVu = session?.id; $('connexion').replaceChildren();
  if (!session) return montrerCompte($('etat'), $('connexion'), "请登录以查看你的工单。");
  if (!cartes.size) ecrire($('etat'), "正在加载…");
  try {
    const lus = [];
    for (let debut = 0; debut <= Math.max(0, cartes.size - 1); debut += PAGE) {
      const page = await rpc('lire_tickets', { tous: false, debut });
      lus.push(...page.slice(0, PAGE));
      if (page.length <= PAGE) { plus?.remove(); plus = null; break; }
      if (!plus) plus = bouton("显示更多", suite, 'fermer');
    }
    ranger(lus);
    for (const [id, c] of cartes) if (!lus.some(t => t.id === id)) { c.remove(); cartes.delete(id); }
    if (plus) $('tickets').append(plus);
    ecrire($('etat'), cartes.size ? '' : "你还没有工单。");
  } catch (x) {
    if (x.code === 401) return changer(null); // connexion expirée : les boutons reviennent
    if (!cartes.size) ecrire($('etat'), "无法读取你的工单。", true);
  }
}
function ranger(lus, enBas) {
  for (const t of enBas ? lus : lus.slice().reverse()) {
    if (cartes.has(t.id)) { cartes.get(t.id).maj(t); continue; }
    const c = carteTicket(t); cartes.set(t.id, c); $('tickets')[enBas ? 'append' : 'prepend'](c);
  }
}
async function suite() {
  const page = await rpc('lire_tickets', { tous: false, debut: cartes.size }).catch(() => []);
  ranger(page.slice(0, PAGE), true);
  if (page.length > PAGE) $('tickets').append(plus); else { plus.remove(); plus = null; }
}
document.addEventListener('compte', montrer);
const relire = regrouper(montrer);
document.addEventListener('direct', e => { if (['tickets', 'tout'].includes(e.detail.quoi)) relire(); });
setInterval(() => { if (session && !document.hidden && !enDirect('compte:' + session.id)) montrer(); }, 15000); // secours si le temps réel est coupé
compte.then(montrer);
</script>
</body>
</html>
