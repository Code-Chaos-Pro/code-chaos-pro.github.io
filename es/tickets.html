<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tickets</title>
<meta name="description" content="Los tickets que has enviado.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://codechaoslab.com/es/tickets">
<link rel="icon" type="image/png" sizes="192x192" href="/images/code-chaos.png">
<link rel="stylesheet" href="/style.css?14">
<script src="logiciels.js?12"></script>
<script src="compte.js?4"></script>
</head>
<body>
<header class="cadre entete">
  <a class="marque" href="./">Code &amp; Chaos</a>
  <nav aria-label="Páginas"><a href="./">Programas</a><a href="contact">Abrir un ticket</a><a href="tickets" id="mes-tickets" aria-current="page">Mis tickets</a><a href="apropos">Acerca de</a></nav>
  <script>outils()</script>
</header>
<main class="cadre">
<section class="intro">
  <h1>Mis tickets</h1>
  <p id="etat" role="status">Cargando…</p>
</section>
<div class="connexion" id="connexion"></div>
<div class="tickets" id="tickets"></div>
</main>
<footer><div class="cadre">
  <p class="doux">Code &amp; Chaos. Programas gratuitos. <a href="/mentions-legales">Aviso legal (en francés)</a> · <a href="/confidentialite">Privacidad (en francés)</a></p>
  <a class="don" href="https://ko-fi.com/codechaos"><svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M14,4 H15.5 A3,3 0 0 1 15.5,10 H14" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1,2 H14 V10 A4,4 0 0 1 10,14 H5 A4,4 0 0 1 1,10 Z" fill="#fff"/><path d="M7.5,11.5 L4.2,8 A2,2 0 0 1 7.5,5.6 A2,2 0 0 1 10.8,8 Z" fill="#ff5e5b"/></svg>Hacer una donación</a>
</div></footer>
<script>
const $ = id => document.getElementById(id);
const el = (balise, texte, classe) => { const e = document.createElement(balise); e.textContent = texte; if (classe) e.className = classe; return e; };
// Images : privées, demandées avec la connexion de la personne. Affichées au clic seulement.
async function montrerImages(zone, chemins) {
  zone.replaceChildren();
  for (const c of chemins) try {
    const i = new Image(); i.src = URL.createObjectURL(await (await appel('/storage/v1/object/authenticated/messages/' + c)).blob()); i.alt = '';
    zone.append(i);
  } catch { zone.append(el('span', "Imagen no disponible", 'doux')); }
}
function ticket(t) {
  const a = el('article', '', 'encart'), type = t.type === 'demande' ? "Una petición" : "Un problema";
  const sujet = (SUJETS[t.type] || []).find(([code]) => code === t.sujet)?.[1] || t.sujet;
  const logiciel = LOGICIELS.find(l => l.id === t.logiciel)?.nom || "Otro";
  const date = new Date(t.cree).toLocaleString(racine.lang, { dateStyle: 'long', timeStyle: 'short' });
  a.append(el('h2', sujet), el('p', `${type} · ${logiciel} · ${date}`, 'doux'), el('p', t.texte, 'message'));
  if (t.images.length) { const z = el('div', '', 'apercus'); z.append(bouton(`${"Ver las imágenes"} (${t.images.length})`, () => montrerImages(z, t.images))); a.append(z); }
  return a;
}
async function montrer() {
  $('tickets').replaceChildren();
  $('connexion').replaceChildren();
  if (!session) return montrerCompte($('etat'), $('connexion'), "Inicia sesión para ver tus tickets.");
  ecrire($('etat'), "Cargando…");
  try {
    const liste = await (await appel('/rest/v1/messages?select=cree,type,logiciel,sujet,texte,images&order=cree.desc&limit=100')).json();
    ecrire($('etat'), liste.length ? '' : "Todavía no tienes tickets.");
    $('tickets').replaceChildren(...liste.map(ticket));
  } catch (x) {
    if (x.code === 401) return changer(null); // connexion expirée : les boutons reviennent
    ecrire($('etat'), "No se pueden leer tus tickets.", true);
  }
}
document.addEventListener('compte', montrer);
compte.then(montrer);
</script>
</body>
</html>
