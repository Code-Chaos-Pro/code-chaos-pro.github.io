<main class="cadre">
<section class="intro">
  <h1>我的工单</h1>

</section>
<div class="connexion" id="connexion"></div>

<footer><div class="cadre">
  <p class="doux">Code &amp; Chaos。免费软件。 <a href="/mentions-legales">法律声明（法语）</a> · <a href="/confidentialite">隐私（法语）</a></p>

</div></footer>
<script>
const $ = id => document.getElementById(id);
let montre = null;
async function montrer() {
  if (session && montre === session.id) return;
  montre = session?.id; $('tickets').replaceChildren(); $('connexion').replaceChildren();
  if (!session) return montrerCompte($('etat'), $('connexion'), "请登录以查看你的工单。");
  ecrire($('etat'), "正在加载…");
  try {
    const cartes = await listerTickets($('tickets'), {}, false);
    ecrire($('etat'), cartes.length ? '' : "你还没有工单。");
  } catch (x) {
    montre = null;
    if (x.code === 401) return changer(null); // connexion expirée : les boutons reviennent
    ecrire($('etat'), "无法读取你的工单。", true);
  }
}
document.addEventListener('compte', montrer);
compte.then(montrer);
</script>
</body>
