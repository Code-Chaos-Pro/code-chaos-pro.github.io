<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/images/code-chaos.png">
<link rel="stylesheet" href="/style.css?16">
<link rel="stylesheet" href="/dev.css?1">
<script src="logiciels.js?14"></script>
<script src="compte.js?6"></script>
<script src="avis.js?2"></script>
<script src="direct.js?1"></script>
<script src="tickets.js?2"></script>
</head>
<body>
<div class="console" id="console" hidden>
  <aside class="rail">
    <a class="sortir" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Sortir du mode dev</a>
    <div class="enseigne"><strong>Code &amp; Chaos</strong><span>Console du créateur</span></div>
    <nav id="nav" aria-label="Console">
      <button type="button" data-page="apercu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/></svg>Vue d’ensemble</button>
      <button type="button" data-page="tickets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Tickets<span class="pastille" id="p-tickets"></span></button>
      <button type="button" data-page="applis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.2l5.9-.8z"/></svg>Applis et avis</button>
      <button type="button" data-page="moderation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 7.7-8 9-4.6-1.3-8-4.5-8-9V6z"/></svg>Modération<span class="pastille" id="p-moderation"></span></button>
      <button type="button" data-page="comptes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 10c0-4 3-6 7-6s7 2 7 6m1-18a4 4 0 0 1 0 8m5 10c0-3.4-1.8-5.2-4.5-5.8"/></svg>Comptes</button>
    </nav>
    <div class="rail-bas"><span class="vif" id="vif">Connexion…</span><script>{ const d = document.createElement('div'); d.className = 'outils'; d.append(boutonCompte(), boutonTheme()); document.currentScript.replaceWith(d); }</script></div>
  </aside>
  <main class="corps">
    <header class="tete"><div><h1 id="titre"></h1><p id="sous-titre"></p></div><div class="tete-outils" id="tete-outils"></div></header>

    <section class="pages" id="o-apercu" hidden>
      <div class="kpis" id="kpis"></div>
      <div class="rangee">
        <div class="panneau"><header><h2 id="c-titre"></h2><div class="legende"><span><i></i>Période</span><span><i class="avant"></i>Période d’avant</span></div></header><div class="courbe" id="courbe"></div></div>
        <div class="panneau"><header><h2>Activité</h2></header><div class="flux" id="flux"></div></div>
      </div>
      <div class="rangee trois">
        <div class="panneau"><header><h2>À traiter</h2></header><div class="taches" id="taches"></div></div>
        <div class="panneau"><header><h2>Notes</h2><span class="doux" id="moyenne-notes"></span></header><div class="niveaux" id="notes"></div></div>
        <div class="panneau"><header><h2>Tickets</h2><span class="doux" id="delai"></span></header><div class="niveaux" id="n-tickets"></div></div>
      </div>
      <div class="panneau"><header><h2>Logiciels</h2></header><div class="defile"><table id="t-logiciels"></table></div></div>
      <details class="panneau"><summary>Chiffres jour par jour</summary><div class="defile"><table id="t-jours"></table></div></details>
    </section>

    <section class="boite" id="o-tickets" hidden>
      <div class="boite-liste" id="liste-tickets"></div>
      <div class="boite-fil" id="fil"></div>
      <div class="boite-details" id="details"></div>
    </section>

    <section class="pages" id="o-applis" hidden>
      <div class="applis" id="applis"></div>
      <div class="panneau"><div class="section-avis">
        <aside><p class="moyenne" id="moyenne"></p><div class="filtres" id="filtres" role="group" aria-label="Filtrer par note"></div></aside>
        <div class="colonne"><div><button class="bouton" type="button" id="ecrire" hidden>Donner mon avis</button></div><div class="colonne" id="liste-avis"></div></div>
      </div></div>
    </section>

    <section class="colonnes" id="o-moderation" hidden>
      <div class="panneau"><header><h2>Signalés</h2><span class="doux">À décider</span></header><div class="colonne" id="signales"></div></div>
      <div class="panneau"><header><h2>Masqués</h2><span class="doux">Invisibles pour les visiteurs</span></header><div class="colonne" id="masques"></div></div>
      <div class="panneau"><header><h2>Comptes bloqués</h2><span class="doux">Ni avis, ni votes</span></header><div class="colonne" id="bloques"></div></div>
    </section>

    <section class="panneau" id="o-comptes" hidden><div class="defile"><table id="t-comptes"></table></div><div id="suite-comptes"></div></section>
  </main>
</div>
<div class="avis-flottants" id="flottants" role="status"></div>
<script src="dev.js?1"></script>
</body>
</html>
