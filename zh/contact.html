<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提交工单</title>
<meta name="description" content="提出建议或报告问题。">
<link rel="canonical" href="https://codechaoslab.com/zh/contact">
<link rel="icon" type="image/png" sizes="192x192" href="/images/code-chaos.png">
<link rel="stylesheet" href="/style.css?19">
<script src="logiciels.js?14"></script>
<script src="compte.js?6"></script>
<script src="direct.js?1"></script>
</head>
<body>
<header class="cadre entete">
  <a class="marque" href="./">Code <span>&amp;</span> Chaos</a>
  <nav aria-label="页面"><a href="./">软件</a><a href="contact">提交工单</a><a href="tickets" id="mes-tickets" hidden>我的工单</a><a href="apropos">关于</a></nav>
  <script>outils()</script>
</header>
<main class="cadre">
<section class="intro">
  <h1>提交工单</h1>
  <p id="etat" role="status">正在加载…</p>
  <noscript><p>请写信至 <a href="mailto:contact.codechaos@gmail.com">contact.codechaos@gmail.com</a>.</p></noscript>
</section>
<div class="connexion" id="connexion"></div>
<section class="encart" id="envoye" tabindex="-1" hidden><h2>消息已发送。谢谢！</h2><p>回复会显示在我的工单中，并通过电子邮件通知您：也请查看垃圾邮件。</p><div><button class="bouton" type="button" id="encore">再写一条消息</button></div></section>
<form id="formulaire" hidden>
  <fieldset><legend hidden>消息类型</legend>
    <label><input type="radio" name="type" id="t-demande" value="demande" checked> 建议</label>
    <label><input type="radio" name="type" id="t-signalement" value="signalement"> 问题</label>
  </fieldset>
  <label class="champ" for="logiciel">软件 <select id="logiciel"></select></label>
  <label class="champ" for="sujet">主题 <select id="sujet"></select></label>
  <label class="champ" for="texte">说明 <textarea id="texte" maxlength="4000" required></textarea></label>
  <label class="champ" for="images">图片（可选，1 张或更多） <input type="file" id="images" accept="image/*" multiple></label>
  <div class="apercus" id="apercus"></div>
  <p class="doux">你的消息仅用于回复你。 <a href="/confidentialite">隐私（法语）</a></p>
  <div><button class="bouton" id="envoyer">发送（CTRL + Enter）</button></div>
</form>
</main>
<div class="annonce" id="annonce" aria-hidden="true" hidden><div><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 15-17"/></svg><span>消息已发送</span></div></div>
<footer><div class="cadre">
  <p class="doux">Code &amp; Chaos。免费软件。 <a href="/mentions-legales">法律声明（法语）</a> · <a href="/confidentialite">隐私（法语）</a></p>
  <a class="don" href="https://ko-fi.com/codechaos"><svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M14,4 H15.5 A3,3 0 0 1 15.5,10 H14" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1,2 H14 V10 A4,4 0 0 1 10,14 H5 A4,4 0 0 1 1,10 Z" fill="#fff"/><path d="M7.5,11.5 L4.2,8 A2,2 0 0 1 7.5,5.6 A2,2 0 0 1 10.8,8 Z" fill="#ff5e5b"/></svg>捐赠</a>
</div></footer>
<script>
const $ = id => document.getElementById(id), args = new URLSearchParams(location.search);
const options = (id, liste) => $(id).replaceChildren(...liste.map(([v, t]) => new Option(t, v)));
options('logiciel', LOGICIELS.map(l => [l.id, l.nom]).concat([['autre', "其他"]]));
if (LOGICIELS.some(l => l.id === args.get('logiciel'))) $('logiciel').value = args.get('logiciel');
if (args.get('type') === 'signalement') $('t-signalement').checked = true;
function choisir() {
  const type = $('t-signalement').checked ? 'signalement' : 'demande';
  options('sujet', SUJETS[type]);
}
$('t-demande').onchange = $('t-signalement').onchange = choisir; choisir();
$('images').onchange = e => {
  $('apercus').querySelectorAll('img').forEach(i => URL.revokeObjectURL(i.src));
  $('apercus').replaceChildren(...[...e.target.files].map(f => { const i = new Image(); i.src = URL.createObjectURL(f); i.alt = f.name; return i; }));
};

const dire = (texte, secours) => ecrire($('etat'), texte, secours);
function montrer() {
  $('formulaire').hidden = !session; $('envoye').hidden = true;
  return montrerCompte($('etat'), $('connexion'), "请登录后再写信。这可防止机器人。");
}
// Réduite en JPEG : moins lourde, et sans les données cachées (lieu de la photo).
async function reduire(fichier) {
  const image = await createImageBitmap(fichier), t = Math.min(1, 1920 / Math.max(image.width, image.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, image.width * t); c.height = Math.max(1, image.height * t);
  const d = c.getContext('2d'); d.fillStyle = '#fff'; d.fillRect(0, 0, c.width, c.height); d.drawImage(image, 0, 0, c.width, c.height);
  return new Promise((ok, non) => c.toBlob(b => b ? ok(b) : non(new Error('image')), 'image/jpeg', .85));
}
$('formulaire').onsubmit = async e => {
  e.preventDefault();
  if (!$('texte').value.trim()) return dire("请填写说明。");
  if ($('images').files.length > 5) return dire("每个工单最多 5 张图片。请移除部分后重试。");
  $('envoyer').disabled = true;
  dire("正在发送…");
  try {
    const images = [];
    for (const f of $('images').files) {
      const chemin = `${session.id}/${crypto.randomUUID()}.jpg`;
      await appel('/storage/v1/object/messages/' + chemin, await reduire(f).catch(() => { throw new Error('image'); }));
      images.push(chemin);
    }
    await appel('/rest/v1/messages', { type: $('t-signalement').checked ? 'signalement' : 'demande', logiciel: $('logiciel').value, sujet: $('sujet').value, texte: $('texte').value, images, langue: racine.lang }, { Prefer: 'return=minimal' });
    $('texte').value = $('images').value = ''; $('apercus').replaceChildren();
    $('formulaire').hidden = true; $('envoye').hidden = false; $('envoye').focus(); $('annonce').hidden = false; chargerProfil();
    return dire('');
  } catch (x) {
    if (x.code === 401) { poser(null); dire("登录已过期。请复制你的文字，然后重新加载页面。"); }
    else if (x.message === 'image') dire("其中一张图片无法读取。请将其移除后重试。");
    else if (x.message.includes('limite')) dire("你在 24 小时内已发送 5 条消息。请稍后再试。");
    else dire("消息未发送。", true);
  } finally { $('envoyer').disabled = false; }
  $('etat').scrollIntoView({ block: 'center' });
};
$('texte').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !$('envoyer').disabled) $('formulaire').requestSubmit(); };
$('encore').onclick = montrer;
$('annonce').onanimationend = e => { if (e.target === e.currentTarget) e.target.hidden = true; };
document.addEventListener('compte', montrer);
compte.then(async ok => { await montrer(); if (!ok) dire("登录失败。请重试。", true); });
</script>
</body>
</html>
