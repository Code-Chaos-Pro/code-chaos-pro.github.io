<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>티켓 만들기</title>
<meta name="description" content="요청을 보내거나 문제를 신고하세요.">
<link rel="canonical" href="https://codechaoslab.com/ko/contact.html">
<link rel="icon" type="image/png" sizes="192x192" href="/images/code-chaos.png">
<link rel="stylesheet" href="/style.css?12">
<script src="logiciels.js?10"></script>
<script src="compte.js?2"></script>
</head>
<body>
<header class="cadre entete">
  <a class="marque" href="./">Code &amp; Chaos</a>
  <nav aria-label="페이지"><a href="./">소프트웨어</a><a href="contact.html">티켓 만들기</a><a href="tickets.html" id="mes-tickets" hidden>내 티켓</a><a href="apropos.html">소개</a></nav>
  <script>outils()</script>
</header>
<main class="cadre">
<section class="intro">
  <h1>티켓 만들기</h1>
  <p id="etat" role="status">불러오는 중…</p>
  <noscript><p>다음으로 보내 주세요: <a href="mailto:contact.codechaos@gmail.com">contact.codechaos@gmail.com</a>.</p></noscript>
</section>
<div class="connexion" id="connexion"></div>
<section class="encart" id="envoye" tabindex="-1" hidden><h2>메시지를 보냈습니다. 감사합니다!</h2><p>답변이 필요하면 이메일로 보내 드립니다.</p><div><button class="bouton" type="button" id="encore">다른 메시지 쓰기</button></div></section>
<form id="formulaire" hidden>
  <fieldset><legend hidden>메시지 유형</legend>
    <label><input type="radio" name="type" id="t-demande" value="demande" checked> 요청</label>
    <label><input type="radio" name="type" id="t-signalement" value="signalement"> 문제</label>
  </fieldset>
  <label class="champ" for="logiciel">소프트웨어 <select id="logiciel"></select></label>
  <label class="champ" for="sujet">주제 <select id="sujet"></select></label>
  <label class="champ" for="texte">설명 <textarea id="texte" maxlength="4000" required></textarea></label>
  <label class="champ" for="images">이미지 (선택, 1개 이상) <input type="file" id="images" accept="image/*" multiple></label>
  <div class="apercus" id="apercus"></div>
  <p class="doux">메시지는 답변을 위해서만 사용됩니다. <a href="/confidentialite.html">개인정보 (프랑스어)</a></p>
  <div><button class="bouton" id="envoyer">보내기</button></div>
</form>
</main>
<div class="annonce" id="annonce" aria-hidden="true" hidden><div><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 15-17"/></svg><span>메시지를 보냈습니다</span></div></div>
<footer><div class="cadre">
  <p class="doux">Code &amp; Chaos. 무료 소프트웨어. <a href="/mentions-legales.html">법적 고지 (프랑스어)</a> · <a href="/confidentialite.html">개인정보 (프랑스어)</a></p>
  <a class="don" href="https://ko-fi.com/codechaos"><svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M14,4 H15.5 A3,3 0 0 1 15.5,10 H14" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1,2 H14 V10 A4,4 0 0 1 10,14 H5 A4,4 0 0 1 1,10 Z" fill="#fff"/><path d="M7.5,11.5 L4.2,8 A2,2 0 0 1 7.5,5.6 A2,2 0 0 1 10.8,8 Z" fill="#ff5e5b"/></svg>후원하기</a>
</div></footer>
<script>
const $ = id => document.getElementById(id), args = new URLSearchParams(location.search);
const options = (id, liste) => $(id).replaceChildren(...liste.map(([v, t]) => new Option(t, v)));
options('logiciel', LOGICIELS.map(l => [l.id, l.nom]).concat([['autre', "기타"]]));
if (LOGICIELS.some(l => l.id === args.get('logiciel'))) $('logiciel').value = args.get('logiciel');
if (args.get('type') === 'signalement') $('t-signalement').checked = true;
function choisir() {
  const type = $('t-signalement').checked ? 'signalement' : 'demande';
  options('sujet', SUJETS[type]);
}
$('t-demande').onchange = $('t-signalement').onchange = choisir; choisir();
$('images').onchange = e => {
  $('apercus').querySelectorAll('img').forEach(i => URL.revokeObjectURL(i.src));
  $('apercus').replaceChildren(...[...e.target.files].map(f => { const i = new Image(); i.src = URL.createObjectURL(f); i.alt = f.name; return i; }));
};

const dire = (texte, secours) => ecrire($('etat'), texte, secours);
function montrer() {
  $('formulaire').hidden = !session; $('envoye').hidden = true;
  return montrerCompte($('etat'), $('connexion'), "작성하려면 로그인하세요. 로봇을 막기 위해서입니다.");
}
// Réduite en JPEG : moins lourde, et sans les données cachées (lieu de la photo).
async function reduire(fichier) {
  const image = await createImageBitmap(fichier), t = Math.min(1, 1920 / Math.max(image.width, image.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, image.width * t); c.height = Math.max(1, image.height * t);
  const d = c.getContext('2d'); d.fillStyle = '#fff'; d.fillRect(0, 0, c.width, c.height); d.drawImage(image, 0, 0, c.width, c.height);
  return new Promise((ok, non) => c.toBlob(b => b ? ok(b) : non(new Error('image')), 'image/jpeg', .85));
}
$('formulaire').onsubmit = async e => {
  e.preventDefault();
  if (!$('texte').value.trim()) return dire("설명을 입력하세요.");
  if ($('images').files.length > 5) return dire("티켓당 이미지는 최대 5개입니다. 일부를 제거하고 다시 시도하세요.");
  $('envoyer').disabled = true;
  dire("보내는 중…");
  try {
    const images = [];
    for (const f of $('images').files) {
      const chemin = `${session.id}/${crypto.randomUUID()}.jpg`;
      await appel('/storage/v1/object/messages/' + chemin, await reduire(f).catch(() => { throw new Error('image'); }));
      images.push(chemin);
    }
    await appel('/rest/v1/messages', { type: $('t-signalement').checked ? 'signalement' : 'demande', logiciel: $('logiciel').value, sujet: $('sujet').value, texte: $('texte').value, images }, { Prefer: 'return=minimal' });
    $('texte').value = $('images').value = ''; $('apercus').replaceChildren();
    $('formulaire').hidden = true; $('envoye').hidden = false; $('envoye').focus(); $('annonce').hidden = false; voirTickets();
    return dire('');
  } catch (x) {
    if (x.code === 401) { session = null; garder('session'); dire("세션이 만료되었습니다. 글을 복사한 다음 페이지를 새로 고치세요."); }
    else if (x.message === 'image') dire("이미지 하나를 읽을 수 없습니다. 제거한 다음 다시 시도하세요.");
    else if (x.message.includes('limite')) dire("24시간 동안 이미 메시지 5개를 보냈습니다. 나중에 다시 시도하세요.");
    else dire("메시지를 보내지 못했습니다.", true);
  } finally { $('envoyer').disabled = false; }
  $('etat').scrollIntoView({ block: 'center' });
};
$('encore').onclick = montrer;
$('annonce').onanimationend = e => { if (e.target === e.currentTarget) e.target.hidden = true; };
document.addEventListener('compte', montrer);
compte.then(async ok => { await montrer(); if (!ok) dire("로그인하지 못했습니다. 다시 시도하세요.", true); });
</script>
</body>
</html>
