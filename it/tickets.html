<main class="cadre">
<section class="intro">
  <h1>I miei ticket</h1>

</section>
<div class="connexion" id="connexion"></div>
<div class="tickets" id="tickets"></div>

<footer><div class="cadre">
  <p class="doux">Code &amp; Chaos. Programmi gratuiti. <a href="/mentions-legales">Note legali (in francese)</a> · <a href="/confidentialite">Privacy (in francese)</a></p>
  <a class="don" href="https://ko-fi.com/codechaos"><svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M14,4 H15.5 A3,3 0 0 1 15.5,10 H14" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1,2 H14 V10 A4,4 0 0 1 10,14 H5 A4,4 0 0 1 1,10 Z" fill="#fff"/><path d="M7.5,11.5 L4.2,8 A2,2 0 0 1 7.5,5.6 A2,2 0 0 1 10.8,8 Z" fill="#ff5e5b"/></svg>Fai una donazione</a>
</div></footer>
<script>
const $ = id => document.getElementById(id);
let montre = null;
async function montrer() {
  if (session && montre === session.id) return;
  montre = session?.id; $('tickets').replaceChildren(); $('connexion').replaceChildren();
  if (!session) return montrerCompte($('etat'), $('connexion'), "Accedi per vedere i tuoi ticket.");
  ecrire($('etat'), "Caricamento…");
  try {
    const cartes = await listerTickets($('tickets'), {}, false);
    ecrire($('etat'), cartes.length ? '' : "Non hai ancora ticket.");
  } catch (x) {
    montre = null;
    if (x.code === 401) return changer(null); // connexion expirée : les boutons reviennent
    ecrire($('etat'), "Impossibile leggere i tuoi ticket.", true);
  }
}
document.addEventListener('compte', montrer);
compte.then(montrer);
</script>
</body>
