<body>

<main class="cadre">
<section class="intro">
  <h1>Windows için ücretsiz yazılımlar</h1>
  <p class="doux">İndirmek ve nasıl kullanıldığını görmek için bir yazılım seçin.</p>
  <div id="total"></div>
  <div class="barre-tri">
    <label for="tri">Sırala <select id="tri"></select></label>
    <div class="vues" id="vues" role="group" aria-label="Görünüm">
      <button type="button" data-vue="grille" aria-label="Izgara" title="Izgara"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="currentColor"/></svg></button>
      <button type="button" data-vue="liste" aria-label="Liste" title="Liste"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h4v4H4zM10 6h10v2H10zM4 10h4v4H4zM10 11h10v2H10zM4 15h4v4H4zM10 16h10v2H10z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="logiciels" id="logiciels"></div>
</section>
</main>
<footer><div class="cadre">
  <p class="doux">Code &amp; Chaos. Ücretsiz yazılımlar. <a href="/mentions-legales">Yasal bilgiler (Fransızca)</a> · <a href="/confidentialite">Gizlilik (Fransızca)</a></p>
  <a class="don" href="https://ko-fi.com/codechaos"><svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M14,4 H15.5 A3,3 0 0 1 15.5,10 H14" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1,2 H14 V10 A4,4 0 0 1 10,14 H5 A4,4 0 0 1 1,10 Z" fill="#fff"/><path d="M7.5,11.5 L4.2,8 A2,2 0 0 1 7.5,5.6 A2,2 0 0 1 10.8,8 Z" fill="#ff5e5b"/></svg>Bağış yap</a>
</div></footer>
<script>
const $ = id => document.getElementById(id);
const lu = (k, choix) => { try { const v = localStorage.getItem(k); return choix.includes(v) ? v : choix[0]; } catch { return choix[0]; } };
const note = (k, v) => { try { localStorage.setItem(k, v); } catch { } };
const TRIS = {
  aleatoire: ["Rastgele", (a, b) => a.hasard - b.hasard],
  alphabetique: ["Alfabetik", (a, b) => a.nom.localeCompare(b.nom, racine.lang)],
  telechargements: ["En çok indirilen", (a, b) => b.telechargements - a.telechargements],
  vues: ["En çok görüntülenen", (a, b) => b.vues - a.vues],
  recents: ["Yakın zamanda güncellenen", (a, b) => b.maj.localeCompare(a.maj)],
};
let comptes = null; // compteurs de la base ; null = elle ne répond pas, rien n'est affiché
const liste = LOGICIELS.map(l => ({ ...l, hasard: Math.random(), vues: 0, telechargements: 0 }));
function afficher() {
  const vue = lu('vue', ['grille', 'liste']);
  liste.sort(TRIS[$('tri').value][1]);
  $('logiciels').classList.toggle('en-liste', vue === 'liste');
  for (const b of $('vues').children) b.setAttribute('aria-pressed', b.dataset.vue === vue);
  $('logiciels').innerHTML = liste.map(l => `<article class="logiciel">
  <img src="${l.icone}" alt="" width="88" height="88"><div class="nom"><a href="${l.page}">${l.nom}</a><span class="doux">Sürüm ${l.version}</span><p class="description">${l.description}</p></div>
  <div class="infos">${comptes ? `<div class="compteurs">${badgeVues(l.vues)}${badgeTelechargements(l.telechargements)}</div>` : ''}<dl class="fiche"><dt>Güncellendi</dt><dd>${dateFr(l.maj)}</dd><dt>Yayınlandı</dt><dd>${dateFr(l.sortie)}</dd></dl></div></article>`).join('');
  liste.forEach((l, i) => $('logiciels').children[i].append(etoile(l.id)));
  const total = liste.reduce((t, l) => t + l.telechargements, 0);
  $('total').innerHTML = total ? badgeTelechargements(total) : '';
}
// Tri et affichage : gardés dans le navigateur, et avec le compte si la personne est connectée.
function garder(cle, valeur) {
  note(cle, valeur); afficher();
  if (session) ecrireTable('preferences?on_conflict=id', { tri: $('tri').value, vue: lu('vue', ['grille', 'liste']) }, ',resolution=merge-duplicates').catch(() => { });
}
async function preferences() {
  if (session) try {
    const [p] = await lireTable('preferences?select=tri,vue');
    if (p) { note('tri', p.tri); note('vue', p.vue); $('tri').value = lu('tri', Object.keys(TRIS)); afficher(); }
  } catch { }
}
for (const [cle, [nom]] of Object.entries(TRIS)) $('tri').add(new Option(nom, cle));
$('tri').value = lu('tri', Object.keys(TRIS));
$('tri').onchange = () => garder('tri', $('tri').value);
for (const b of $('vues').children) b.onclick = () => garder('vue', b.dataset.vue);
afficher();
preferences();
document.addEventListener('compte', preferences);
compteurs().then(c => { comptes = c; if (c) liste.forEach(l => Object.assign(l, c[l.id])); afficher(); });
</script>
</body>
</html>
