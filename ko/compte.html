<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 계정</title>
<meta name="description" content="Code &amp; Chaos 계정입니다.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://codechaoslab.com/ko/compte">
<link rel="icon" type="image/png" sizes="192x192" href="/images/code-chaos.png">
<link rel="stylesheet" href="/style.css?14">
<script src="logiciels.js?12"></script>
<script src="compte.js?4"></script>
</head>
<body>
<header class="cadre entete">
  <a class="marque" href="./">Code &amp; Chaos</a>
  <nav aria-label="페이지"><a href="./">소프트웨어</a><a href="contact">티켓 만들기</a><a href="tickets" id="mes-tickets" hidden>내 티켓</a><a href="apropos">소개</a></nav>
  <script>outils()</script>
</header>
<main class="cadre">
<section class="intro">
  <h1>내 계정</h1>
  <p id="etat" role="status">불러오는 중…</p>
</section>
<div class="connexion" id="connexion"></div>
<div class="tickets" id="mon-compte" hidden>
<section class="encart"><h2>프로필</h2>
  <p class="doux">사용자 이름과 아바타는 리뷰 옆에 표시됩니다.</p>
  <form id="f-pseudo"><label class="champ" for="pseudo">사용자 이름 <input id="pseudo"></label><p class="doux" id="e-pseudo" role="status"></p><div><button class="bouton">저장</button></div></form>
  <h3>아바타</h3><div class="avatars" id="avatars" role="group" aria-label="아바타"></div>
  <dl class="fiche" id="fiche"></dl>
</section>
<section class="encart"><h2>즐겨찾기</h2><div id="favoris"></div></section>
<section class="encart"><h2>기록</h2><div id="historique"></div><div><button class="fermer" type="button" id="vider">기록 지우기</button></div></section>
<section class="encart"><h2>로그아웃</h2><div><button class="fermer" type="button" id="sortir">로그아웃</button></div></section>
<section class="encart"><h2>내 계정 삭제</h2><p>되돌릴 수 없으며 모든 데이터가 삭제됩니다.</p><div><button class="bouton danger" type="button" id="supprimer">내 계정 삭제</button></div></section>
</div>
</main>
<footer><div class="cadre">
  <p class="doux">Code &amp; Chaos. 무료 소프트웨어. <a href="/mentions-legales">법적 고지 (프랑스어)</a> · <a href="/confidentialite">개인정보 (프랑스어)</a></p>
  <a class="don" href="https://ko-fi.com/codechaos"><svg viewBox="0 0 20 16" width="20" height="16" aria-hidden="true"><path d="M14,4 H15.5 A3,3 0 0 1 15.5,10 H14" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1,2 H14 V10 A4,4 0 0 1 10,14 H5 A4,4 0 0 1 1,10 Z" fill="#fff"/><path d="M7.5,11.5 L4.2,8 A2,2 0 0 1 7.5,5.6 A2,2 0 0 1 10.8,8 Z" fill="#ff5e5b"/></svg>후원하기</a>
</div></footer>
<script>
const $ = id => document.getElementById(id);
const texte = t => { const p = document.createElement('p'); p.className = 'doux'; p.textContent = t; return p; };
Object.assign($('pseudo'), PSEUDO);
async function enregistrer(champs) {
  await appel('/rest/v1/profils?id=eq.' + session.id, champs, { Prefer: 'return=minimal' }, 'PATCH');
  changer({ ...session, ...champs });
}
$('avatars').append(...AVATARS.map((_, n) => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('aria-label', `${"아바타"} ${n + 1}`); b.append(avatar(n));
  b.onclick = () => enregistrer({ avatar: n }).catch(() => { $('e-pseudo').textContent = "아바타가 저장되지 않았습니다. 다시 시도하세요."; });
  return b;
}));
$('f-pseudo').onsubmit = async e => {
  e.preventDefault();
  try { await enregistrer({ pseudo: $('pseudo').value.trim() }); $('e-pseudo').textContent = "사용자 이름이 저장되었습니다."; }
  catch (x) { $('e-pseudo').textContent = erreurPseudo(x); }
};
function montrerFavoris() { $('favoris').replaceChildren(favoris.size ? listeLogiciels([...favoris].map(f => [f])) : texte("아직 즐겨찾기가 없습니다. 프로그램의 별을 클릭하세요.")); }
async function montrerHistorique() {
  let vus = [];
  try { vus = await lireTable('historique?select=logiciel,vu&order=vu.desc'); } catch { return $('historique').replaceChildren(texte("기록을 읽을 수 없습니다.")); }
  $('vider').hidden = !vus.length;
  $('historique').replaceChildren(vus.length ? listeLogiciels(vus.map(v => [v.logiciel, dateFr(v.vu)])) : texte("기록이 없습니다."));
}
$('vider').onclick = () => appel('/rest/v1/historique?compte=eq.' + session.id, undefined, {}, 'DELETE').then(montrerHistorique, () => $('historique').append(texte("기록이 지워지지 않았습니다. 다시 시도하세요.")));
$('sortir').onclick = deconnecter;
$('supprimer').onclick = () => {
  const { d, zone } = fenetre("내 계정을 삭제할까요?"), p = texte("되돌릴 수 없으며 모든 데이터가 삭제됩니다.");
  const b = bouton("삭제", async () => {
    b.disabled = true; p.textContent = "삭제 중…";
    try {
      // Images des tickets d'abord : la base ne sait pas effacer les fichiers.
      const dossier = session.id;
      const images = await (await appel('/storage/v1/object/list/messages', { prefix: dossier, limit: 1000 })).json();
      if (images.length) await appel('/storage/v1/object/messages', { prefixes: images.map(i => `${dossier}/${i.name}`) }, {}, 'DELETE');
      await appel('/rest/v1/rpc/supprimer_compte', {});
      d.close(); changer(null);
    } catch { b.disabled = false; ecrire(p, "계정이 삭제되지 않았습니다. 다시 시도하세요.", true); }
  }, 'bouton danger');
  zone.append(p); d.lastChild.append(b);
};
let montre = null; // compte dont l'historique est déjà affiché
async function montrer() {
  $('mon-compte').hidden = !session?.pseudo;
  $('connexion').replaceChildren();
  if (!session?.pseudo) { montre = null; return montrerCompte($('etat'), $('connexion'), "계정을 보려면 로그인하세요."); }
  ecrire($('etat'), '');
  $('pseudo').value = session.pseudo;
  [...$('avatars').children].forEach((b, n) => b.setAttribute('aria-pressed', n === session.avatar));
  $('fiche').replaceChildren(...[["이메일 주소", session.email || "없음"], ["계정 생성일", dateFr(session.cree)]].flatMap(([t, v]) => { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = t; dd.textContent = v; return [dt, dd]; }));
  montrerFavoris();
  if (montre !== session.id) { montre = session.id; montrerHistorique(); }
}
document.addEventListener('compte', montrer);
document.addEventListener('favoris', montrerFavoris);
compte.then(montrer);
</script>
</body>
</html>
