<script>
catalogue();
// Les lettres de « code & chaos » : départ au hasard, arrivée alignée pour « code », de travers pour « chaos ». Un clic recommence.
const lettres = document.getElementById('lettres'), hasard = n => Math.round((Math.random() * 2 - 1) * n);
function melanger() {
  let k = 0;
  lettres.replaceChildren(...['<code>', '&', '<chaos/>'].map((mot, ligne) => {
    const d = document.createElement('div');
    for (const c of mot) {
      const s = document.createElement('span');
      s.textContent = c;
      const v = { x: hasard(170) + 'px', y: hasard(110) + 'px', r: hasard(200) + 'deg', d: k++ * 45 + 'ms', t: `var(--t${ligne === 1 ? 4 : /[<>/]/.test(c) ? 1 : ligne === 0 ? 2 : 3})` };
      if (ligne === 2) Object.assign(v, { f: hasard(16) + 'deg', b: hasard(9) + 'px' });
      for (const [n, x] of Object.entries(v)) s.style.setProperty('--' + n, x);
      d.append(s);
    }
    return d;
  }));
}
melanger();
lettres.onclick = () => { lettres.classList.add('clic'); melanger(); }; // clic : animé même si Windows coupe les animations
</script>
